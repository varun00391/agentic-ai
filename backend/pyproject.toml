[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-agent-v2"
version = "0.2.0"
description = "Production multi-tenant expense capture platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt==4.3.0",
    "fastapi==0.141.1",
    "numpy==2.2.6",
    "openai==1.109.1",
    "pillow==11.3.0",
    "psycopg[binary]==3.2.10",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pymupdf==1.28.2",
    "pyjwt==2.10.1",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
]
ocr = [
    "paddleocr==3.7.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
